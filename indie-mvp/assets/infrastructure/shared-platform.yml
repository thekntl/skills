version: "3.9"

# AUTHORING TEMPLATE ONLY — NOT RUNTIME-READY.
# Keep FOUNDATION_STATE=BLOCKED_OWNER_VERIFICATION until owner-values.md is complete,
# the selected immutable artifacts are proven in staging, and an isolated restore passes.
# Never execute this file through an agent.

x-indie-mvp-foundation:
  state: "${FOUNDATION_STATE}"
  environment: "${ENVIRONMENT}"
  contract-evidence: "${FOUNDATION_CONTRACT_EVIDENCE}"

services:
  postgres:
    image: "${POSTGRES_IMAGE}"
    environment:
      POSTGRES_DB: "postgres"
      POSTGRES_USER_FILE: "/run/secrets/postgres_admin_user"
      POSTGRES_PASSWORD_FILE: "/run/secrets/postgres_admin_password"
    secrets:
      - postgres_admin_user
      - postgres_admin_password
    volumes:
      - type: volume
        source: postgres_data
        target: "${POSTGRES_DATA_TARGET}"
    networks:
      - backend
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$(cat /run/secrets/postgres_admin_user)" -d postgres
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    deploy:
      replicas: 1
      placement:
        constraints:
          - "${POSTGRES_NODE_LABEL}"
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: "${POSTGRES_CPU_LIMIT}"
          memory: "${POSTGRES_MEMORY_LIMIT}"
        reservations:
          cpus: "${POSTGRES_CPU_RESERVATION}"
          memory: "${POSTGRES_MEMORY_RESERVATION}"

  freescout:
    image: "${FREESCOUT_IMAGE}"
    environment:
      SETUP_TYPE: "${FREESCOUT_SETUP_TYPE}"
      APP_URL: "https://${FREESCOUT_HOSTNAME}"
      DB_TYPE: "pgsql"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_NAME: "${FREESCOUT_DB_NAME}"
      DB_USER: "${FREESCOUT_DB_USER}"
      DB_PASS_FILE: "/run/secrets/freescout_db_password"
      FREESCOUT_APP_KEY_FILE: "/run/secrets/freescout_app_key"
      SCHEDULER_TYPE: "${FREESCOUT_SCHEDULER_TYPE}"
      ENABLE_AUTO_UPDATE: "${FREESCOUT_ENABLE_AUTO_UPDATE}"
    secrets:
      - freescout_db_password
      - freescout_app_key
    volumes:
      - type: volume
        source: freescout_data
        target: /data
    networks:
      - backend
      - ingress
    deploy:
      replicas: 1
      placement:
        constraints:
          - "${FREESCOUT_NODE_LABEL}"
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback
        monitor: 60s
      rollback_config:
        parallelism: 1
        order: stop-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
        window: 120s
      resources:
        limits:
          cpus: "${FREESCOUT_CPU_LIMIT}"
          memory: "${FREESCOUT_MEMORY_LIMIT}"
        reservations:
          cpus: "${FREESCOUT_CPU_RESERVATION}"
          memory: "${FREESCOUT_MEMORY_RESERVATION}"

networks:
  backend:
    external: true
    name: "${BACKEND_NETWORK}"
  ingress:
    external: true
    name: "${INGRESS_NETWORK}"

volumes:
  postgres_data:
    external: true
    name: "${POSTGRES_VOLUME}"
  freescout_data:
    external: true
    name: "${FREESCOUT_DATA_VOLUME}"

secrets:
  postgres_admin_user:
    external: true
    name: "${POSTGRES_ADMIN_USER_SECRET}"
  postgres_admin_password:
    external: true
    name: "${POSTGRES_ADMIN_PASSWORD_SECRET}"
  freescout_db_password:
    external: true
    name: "${FREESCOUT_DB_PASSWORD_SECRET}"
  freescout_app_key:
    external: true
    name: "${FREESCOUT_APP_KEY_SECRET}"
